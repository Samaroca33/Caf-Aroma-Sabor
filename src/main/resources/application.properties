spring.application.name=CafeAromaSabores

# ===========================
# DATASOURCE - MySQL Configuration
# ===========================
# Substitua os valores abaixo pelos seus dados reais
# jdbc:mysql://host:porta/nome_banco
spring.datasource.url=jdbc:mysql://localhost:3306/cafearomasabor?createDatabaseIfNotExist=true  
spring.datasource.username=root
spring.datasource.password=Senai@403

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA/Hibernate Configuration
# ===========================
# Criar tabelas automaticamente se não existirem
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL gerado no console
spring.jpa.show-sql=true

# Formatar SQL no console
spring.jpa.properties.hibernate.format_sql=true


# ===========================
# Thymeleaf Configuration
# ===========================
# Cache desativado para desenvolvimento
spring.thymeleaf.cache=false

# Prefixo do template (pasta dentro de templates)
spring.thymeleaf.prefix=classpath:/templates/

# Sufixo do template
spring.thymeleaf.suffix=.html

# Modo de template
spring.thymeleaf.mode=HTML5

# ===========================
# Server Configuration
# ===========================
# Porta da aplicação
server.port=8080

# Context path (opcional, para acessar em http://localhost:8080/app/)
# server.servlet.context-path=/app

