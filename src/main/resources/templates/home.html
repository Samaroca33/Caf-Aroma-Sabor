<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Café Aroma & Sabor — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almoxarifado.css}"/>
</head>
<body>

<div id="page-app" class="page active" style="display:flex;">

    <nav class="sidebar">
        <div class="sidebar-brand">
            <div class="s-bean"></div>
            <h2>Aroma & Sabor</h2>
            <span>Almoxarifado</span>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section">Principal</div>
            <a class="nav-link active" th:href="@{/home}">
                <span class="nav-icon">⬡</span> Dashboard
            </a>
            <div class="nav-section">Módulos</div>
            <a class="nav-link" th:href="@{/produto}">
                <span class="nav-icon">⊞</span> Cadastro de Produto
            </a>
            <a class="nav-link" th:href="@{/estoque}">
                <span class="nav-icon">◫</span> Gestão de Estoque
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info" th:if="${#authentication != null}">
                <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 2))}">US</div>
                <div class="user-details">
                    <div class="user-name" th:text="${#authentication.name}">usuario@cafe.com</div>
                    <div class="user-role">Logado</div>
                </div>
            </div>

            <form method="POST" th:action="@{/logout}" style="display: inline;">
                <button type="submit" class="nav-link" style="
                    background: none;
                    border: none;
                    color: rgba(245,237,224,.5);
                    cursor: pointer;
                    width: 100%;
                    text-align: left;
                    padding: 12px 20px;
                    font-size: 14px;
                    font-weight: 500;">
                    <span class="nav-icon">↩</span> Sair
                </button>
            </form>
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Dashboard</div>
        </div>
        <div class="content-area">

            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Total de Produtos</div>
                    <div class="kpi-value" th:text="${totalProdutos != null ? totalProdutos : 0}">0</div>
                    <div class="kpi-sub">cadastrados no sistema</div>
                </div>
                <div class="kpi-card alert-card">
                    <div class="kpi-label">Estoque Mínimo ⚠</div>
                    <div class="kpi-value" th:text="${produtosCriticos != null ? produtosCriticos : 0}">0</div>
                    <div class="kpi-sub">produtos abaixo do limite</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Movimentações Recentes</div>
                    <div class="kpi-value" th:text="${movimentacoesRecentes != null ? movimentacoesRecentes : 0}">0</div>
                    <div class="kpi-sub">nos últimos 7 dias</div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
