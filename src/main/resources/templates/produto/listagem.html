<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aroma & Sabor — Almoxarifado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=500;700&family=DM+Sans:wght=300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almoxarifado.css}"/>
</head>
<body>
<div class="container">

    <div class="sidebar">
        <div class="logo">
            <div class="icon"></div>
            <h1>Aroma & Sabor</h1>
            <p>ALMOXARIFADO</p>
        </div>

        <div class="menu">
            <p class="section-title">PRINCIPAL</p>
            <a th:href="@{/home}" class="menu-item">
                <i class="icon-dashboard"></i> Dashboard
            </a>

            <p class="section-title">MÓDULOS</p>
            <a th:href="@{/produto}" class="menu-item active">
                <i class="icon-produto"></i> Cadastro de Produto
            </a>
            <a th:href="@{/estoque}" class="menu-item">
                <i class="icon-estoque"></i> Gestão de Estoque
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span class="username">admin@cafe.com</span>
                    <span class="role">Logado</span>
                </div>
            </div>
            <form method="POST" th:action="@{/logout}" id="logoutForm" style="display: block; width: 100%;">
                <button type="submit" class="logout-btn" style="width: 100%; border: none; background: none; text-align: left; padding: 0; cursor: pointer;">Sair</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Cadastro de Produtos</h2>
            <a th:href="@{/produto/novo}" class="btn-primary">+ Novo Produto</a>
        </div>

        <div class="content-body">

            <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <div class="search-container">
                <form method="GET" th:action="@{/produto}">
                    <input type="text" name="busca" placeholder="Pesquisar por nome do produto..." th:value="${param.busca}"/>
                    <button type="submit" class="btn-search">Buscar</button>
                </form>
            </div>

            <div class="grid-produtos">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOME</th>
                        <th>LOTE</th>
                        <th>VALIDADE</th>
                        <th>QTD ATUAL</th>
                        <th>QTD MÍNIMA</th>
                        <th>AÇÕES</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="7" class="empty-message" style="text-align: center; padding: 20px;">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="prod : ${produtos}">
                        <td th:text="${prod.id}">1</td>
                        <td th:text="${prod.nome}">Café Espresso</td>
                        <td th:text="${prod.lote}">LOTE123</td>
                        <td th:text="${#temporals.format(prod.dataValidade, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${prod.quantidadeAtual}">10</td>
                        <td th:text="${prod.estoqueMinimo}">5</td>
                        <td class="table-actions">
                            <a th:href="@{/produto/editar/{id}(id=${prod.id})}" class="btn-action-edit">Editar</a>
                            <form method="POST" th:action="@{/produto/excluir/{id}(id=${prod.id})}" style="display: inline;" onsubmit="return confirm('Tem certeza que deseja remover este produto?');">
                                <button type="submit" class="btn-action-delete" style="border: none; cursor: pointer;">Excluir</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
</body>
</html>
