<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Café Aroma & Sabor — Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almoxarifado.css}"/>
</head>
<body>

<div id="page-app" class="page active" style="display:flex;">

    <nav class="sidebar">
        <div class="sidebar-brand">
            <div class="s-bean"></div>
            <h2>Aroma & Sabor</h2>
            <span>Almoxarifado</span>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section">Principal</div>
            <a class="nav-link" th:href="@{/home}"><span class="nav-icon">⬡</span> Dashboard</a>
            <div class="nav-section">Módulos</div>
            <a class="nav-link active" th:href="@{/produto}"><span class="nav-icon">⊞</span> Cadastro de Produto</a>
            <a class="nav-link" th:href="@{/estoque}"><span class="nav-icon">◫</span> Gestão de Estoque</a>
        </div>
        <div class="sidebar-footer">
            <a class="nav-link" th:href="@{/logout}" style="color:rgba(245,237,224,.5);"><span class="nav-icon">↩</span> Sair</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Cadastro de Produto</div>
            <div class="topbar-actions">
                <a class="btn btn-primary" th:href="@{/produto/novo}">＋ Novo Produto</a>
            </div>
        </div>
        <div class="content-area">

            <div class="table-card">
                <div class="table-toolbar">
                    <form method="GET" th:action="@{/produto}" style="display:flex;gap:12px;flex:1;">
                        <div class="search-wrap">
                            <span class="search-icon">🔍</span>
                            <input type="text" name="busca" placeholder="Buscar por nome do produto…" th:value="${busca}"/>
                        </div>
                        <button type="submit" class="btn btn-secondary">Buscar</button>
                    </form>
                </div>

                <!-- Tabela com dados reais do banco -->
                <table th:if="${produtos != null and !produtos.empty}">
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Lote</th>
                        <th>Validade</th>
                        <th>Qtd. Atual</th>
                        <th>Mínimo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td><strong th:text="${produto.nome}">—</strong></td>
                        <td th:text="${produto.lote}">—</td>
                        <td th:text="${produto.dataValidade != null ? #temporals.format(produto.dataValidade,'dd/MM/yyyy') : '—'}">—</td>
                        <td th:text="${produto.quantidadeAtual}">0</td>
                        <td th:text="${produto.estoqueMinimo}">0</td>
                        <td>
                <span th:if="${produto.quantidadeAtual >= produto.estoqueMinimo}">
                  <span class="status-dot dot-ok"></span>OK
                </span>
                            <span th:if="${produto.quantidadeAtual < produto.estoqueMinimo}">
                  <span class="status-dot dot-danger"></span>Crítico
                </span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-icon btn-del" title="Excluir">🗑</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${produtos == null or produtos.empty}"
                     style="padding:40px;text-align:center;color:var(--muted);">
                    Nenhum produto cadastrado ainda.
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
