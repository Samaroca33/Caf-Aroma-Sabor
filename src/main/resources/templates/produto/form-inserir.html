<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Café Aroma &amp; Sabor — Produto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almoxarifado.css}"/>
</head>
<body>

<div id="page-app" class="page active" style="display:flex;">

    <nav class="sidebar">
        <div class="sidebar-brand">
            <div class="s-bean"></div>
            <h2>Aroma &amp; Sabor</h2>
            <span>Almoxarifado</span>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section">Principal</div>
            <a class="nav-link" th:href="@{/home}">
                <span class="nav-icon">⬡</span> Dashboard
            </a>
            <div class="nav-section">Módulos</div>
            <a class="nav-link active" th:href="@{/produto}">
                <span class="nav-icon">⊞</span> Cadastro de Produto
            </a>
            <a class="nav-link" th:href="@{/estoque}">
                <span class="nav-icon">◫</span> Gestão de Estoque
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info" th:if="${#authentication != null}">
                <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 2))}">AD</div>
                <div class="user-details">
                    <div class="user-name" th:text="${#authentication.name}">admin@cafe.com</div>
                    <div class="user-role">Logado</div>
                </div>
            </div>
            <form method="POST" th:action="@{/logout}" style="display:inline;">
                <button type="submit" class="nav-link" style="background:none;border:none;color:rgba(245,237,224,.5);cursor:pointer;width:100%;text-align:left;padding:12px 20px;font-size:14px;font-weight:500;">
                    <span class="nav-icon">↩</span> Sair
                </button>
            </form>
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title" th:text="${produto.id != null} ? 'Editar Produto' : 'Novo Produto'">Novo Produto</div>
            <div class="topbar-actions">
                <a th:href="@{/produto}" class="btn btn-secondary">← Voltar</a>
            </div>
        </div>

        <div class="content-area">

            <!-- Feedback -->
            <div th:if="${erro}" style="background:rgba(184,50,50,.1);color:#b83232;border:1.5px solid rgba(184,50,50,.3);border-radius:10px;padding:12px 16px;font-size:.85rem;margin-bottom:18px;">
                <span th:text="${erro}"></span>
            </div>

            <div class="form-card">
                <form method="POST" th:action="@{/produto/salvar}">

                    <input type="hidden" name="id" th:value="${produto.id}"/>

                    <div class="form-grid">

                        <div class="form-group span-2">
                            <label>Nome do Produto</label>
                            <input type="text" name="nome" th:value="${produto.nome}"
                                   placeholder="Ex: Café Torrado Tradicional 500g" required/>
                        </div>

                        <div class="form-group span-2">
                            <label>Descrição</label>
                            <textarea name="descricao" th:text="${produto.descricao}"
                                      placeholder="Especificações do grão, torra, origem, etc." rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Número do Lote</label>
                            <input type="text" name="lote" th:value="${produto.lote}"
                                   placeholder="Ex: L-202605" required/>
                        </div>

                        <div class="form-group">
                            <label>Data de Validade</label>
                            <input type="date" name="dataValidade" th:value="${produto.dataValidade}" required/>
                        </div>

                        <div class="form-group">
                            <label>Quantidade Inicial</label>
                            <input type="number" name="quantidadeAtual"
                                   th:value="${produto.quantidadeAtual != null ? produto.quantidadeAtual : 0}"
                                   th:readonly="${produto.id != null}"
                                   min="0" required/>
                        </div>

                        <div class="form-group">
                            <label>Estoque Mínimo</label>
                            <input type="number" name="estoqueMinimo"
                                   th:value="${produto.estoqueMinimo != null ? produto.estoqueMinimo : 1}"
                                   min="1" required/>
                        </div>

                    </div>

                    <div class="form-actions">
                        <a th:href="@{/produto}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
