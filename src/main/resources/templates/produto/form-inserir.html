<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aroma & Sabor — Formulário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=500;700&family=DM+Sans:wght=300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almoxarifado.css}"/>
</head>
<body>
<div class="container">

    <div class="sidebar">
        <div class="logo">
            <div class="icon"></div>
            <h1>Aroma & Sabor</h1>
            <p>ALMOXARIFADO</p>
        </div>

        <div class="menu">
            <p class="section-title">PRINCIPAL</p>
            <a th:href="@{/home}" class="menu-item">
                <i class="icon-dashboard"></i> Dashboard
            </a>

            <p class="section-title">MÓDULOS</p>
            <a th:href="@{/produto}" class="menu-item active">
                <i class="icon-produto"></i> Cadastro de Produto
            </a>
            <a th:href="@{/estoque}" class="menu-item">
                <i class="icon-estoque"></i> Gestão de Estoque
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span class="username">admin@cafe.com</span>
                    <span class="role">Logado</span>
                </div>
            </div>
            <form method="POST" th:action="@{/logout}" id="logoutForm" style="display: block; width: 100%;">
                <button type="submit" class="logout-btn" style="width: 100%; border: none; background: none; text-align: left; padding: 0; cursor: pointer;">Sair</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2 th:text="${produto.id != null} ? 'Editar Produto' : 'Novo Produto'">Novo Produto</h2>
            <a th:href="@{/produto}" class="btn-secondary">Voltar</a>
        </div>

        <div class="content-body">

            <div class="card-form">
                <form method="POST" th:action="@{/produto/salvar}">

                    <input type="hidden" name="id" th:value="${produto.id}" />

                    <div class="form-group">
                        <label>NOME DO PRODUTO</label>
                        <input type="text" name="nome" th:value="${produto.nome}" placeholder="Ex: Café Torrado Tradicional 500g" required/>
                    </div>

                    <div class="form-group">
                        <label>DESCRIÇÃO</label>
                        <textarea name="descricao" th:text="${produto.descricao}" placeholder="Especificações do grão, torra, etc."></textarea>
                    </div>

                    <div class="form-group">
                        <label>NÚMERO DO LOTE</label>
                        <input type="text" name="lote" th:value="${produto.lote}" placeholder="Ex: L-202605" required/>
                    </div>

                    <div class="form-group">
                        <label>DATA DE VALIDADE</label>
                        <input type="date" name="dataValidade" th:value="${produto.dataValidade}" required/>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>QUANTIDADE INICIAL</label>
                            <input type="number" name="quantidadeAtual" th:value="${produto.quantidadeAtual != null ? produto.quantidadeAtual : 0}" th:readonly="${produto.id != null}" min="0" required/>
                        </div>
                        <div class="form-group half">
                            <label>ESTOQUE MÍNIMO</label>
                            <input type="number" name="estoqueMinimo" th:value="${produto.estoqueMinimo != null ? produto.estoqueMinimo : 1}" min="1" required/>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Salvar Alterações</button>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>
